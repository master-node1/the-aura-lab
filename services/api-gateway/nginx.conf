events { worker_connections 1024; }

http {
  upstream auth_service      { server auth-service:3000; }
  upstream customer_service  { server customer-service:3000; }
  upstream identity_service  { server identity-service:3001; }

  server {
    listen 8001;

    # ── Auth ──────────────────────────────────────────────────────────────
    location /api/auth/ {
      proxy_pass http://auth_service/api/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Customer
    location /api/customer/ {
      proxy_pass http://customer_service/api/customer/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # Identity: public endpoints only. /internal/* is service-to-service
    # (no JWT) and must never be reachable from outside. Regex locations win
    # over prefix ones, and ~* also catches case variants Express would accept.
    location ~* ^/api/identity/internal(/|$) {
      return 404;
    }

    location /api/identity/ {
      proxy_pass http://identity_service/api/identity/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Gateway health ────────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"ok","service":"api-gateway"}';
      add_header Content-Type application/json;
    }
  }
}
